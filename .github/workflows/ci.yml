name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mototrade
          POSTGRES_PASSWORD: mototrade
          POSTGRES_DB: mototrade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mototrade"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        env:
          MOTOTRADE_TEST_DATABASE_URL: postgresql+psycopg://mototrade:mototrade@localhost:5432/mototrade_test
        run: python -m pytest -q
      - name: Migraciones aplican en PostgreSQL limpio
        env:
          MOTOTRADE_DATABASE_URL: postgresql+psycopg://mototrade:mototrade@localhost:5432/mototrade_test
        run: |
          python - <<'EOF'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg://mototrade:mototrade@localhost:5432/mototrade_test")
          with e.begin() as c:
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public;"))
          EOF
          alembic upgrade head
          python -m mototrade.cli check
      - name: Validar docker-compose
        run: docker compose config -q
