# Mantiene "actividad en el repositorio" para que GitHub no desactive los crons (regla documentada para repos
# públicos a los 60 días sin actividad) y deja un respaldo semanal de la base como artifact (retención corta).
name: keepalive

on:
  schedule:
    - cron: "17 3 * * 1"   # lunes 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    env:
      DB: ${{ secrets.MOTOTRADE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Registrar latido
        run: |
          mkdir -p .keepalive && date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last_run.txt
          git config user.name "mototrade-bot" && git config user.email "bot@users.noreply.github.com"
          git add .keepalive/last_run.txt && git commit -m "keepalive: latido semanal" || echo "sin cambios"
          git push || true
      - name: Backup semanal de la base (pg_dump → artifact)
        if: ${{ env.DB != '' }}
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          pg_dump "${DB/postgresql+psycopg/postgresql}" -Fc -f backup.dump && ls -la backup.dump
      - uses: actions/upload-artifact@v4
        if: ${{ env.DB != '' }}
        with:
          name: mototrade-backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 14
