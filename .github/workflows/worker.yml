# Worker programado (nube gratuita, sin VPS). NO aplica migraciones: si faltan, se detiene con un mensaje claro
# (ejecutar antes el workflow setup-database). Telegram es opcional: sin token, las alertas quedan en la app.
# Cada 30 min en repo privado entra en la cuota gratuita; en repo público puede ser "*/15 * * * *".
name: worker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: mototrade-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOTOTRADE_ENV: production
      MOTOTRADE_LOG_LEVEL: WARNING
      MOTOTRADE_DATABASE_URL: ${{ secrets.MOTOTRADE_DATABASE_URL }}
      MOTOTRADE_SECRET_KEY: ${{ secrets.MOTOTRADE_SECRET_KEY }}
      # Opcionales (vacíos = función desactivada, el worker corre igual)
      MOTOTRADE_TELEGRAM_BOT_TOKEN: ${{ secrets.MOTOTRADE_TELEGRAM_BOT_TOKEN }}
      MOTOTRADE_TELEGRAM_CHAT_ID: ${{ secrets.MOTOTRADE_TELEGRAM_CHAT_ID }}
      MOTOTRADE_ANTHROPIC_API_KEY: ${{ secrets.MOTOTRADE_ANTHROPIC_API_KEY }}
      MOTOTRADE_LLM_PROVIDER: ${{ secrets.MOTOTRADE_LLM_PROVIDER || 'fake' }}
      MOTOTRADE_LLM_MODEL: ${{ secrets.MOTOTRADE_LLM_MODEL || 'claude-haiku-5-5' }}
      MOTOTRADE_SUPABASE_URL: ${{ secrets.MOTOTRADE_SUPABASE_URL }}
      MOTOTRADE_SUPABASE_SERVICE_KEY: ${{ secrets.MOTOTRADE_SUPABASE_SERVICE_KEY }}
      MOTOTRADE_SUPABASE_BUCKET: ${{ secrets.MOTOTRADE_SUPABASE_BUCKET || 'fotos' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt && pip install -q -e .
      - name: Esquema al día (no migra; falla si faltan migraciones)
        run: python -m mototrade.cli db-status
      - name: Una pasada del worker
        run: python -m mototrade.cli worker --once
      - name: Verificar integridad de auditoría
        run: python -m mototrade.cli verify-audit
