[project]
name = "mototrade-ai"
version = "0.2.0"
description = "MotoTrade AI — plataforma privada para gestionar y automatizar la compra y reventa de motos usadas (Rosario, Santa Fe)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6",
    "argon2-cffi>=23",
    "streamlit>=1.48,<2",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
mototrade = "mototrade.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mototrade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
